# Production / Coolify stack. Postgres is not published on the host.
# Requires POSTGRES_PASSWORD in the environment (or a sibling .env file).
# Do not set OPENAI_BASE_URL or GOOGLE_GENAI_USE_VERTEXAI — paid calls refuse them.
#
# Optional tuning (ASTRO_BUDGET_*, ASTRO_DAILY_*, GEMINI_* concurrency/retry,
# OPENAI_REASONING_EFFORT, ASTRO_ASK_MODEL): set on the Coolify/host service
# when needed — omit them here so empty strings do not override code defaults.
#
# Local host API + published Postgres: docker-compose.dev.yml

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astrology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret — do not use the local default}
      POSTGRES_DB: ${POSTGRES_DB:-astrology}
    # Not published on the host — API reaches Postgres on the compose network only.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "4020:4020"
    environment:
      HOST: "0.0.0.0"
      PORT: "4020"
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-astrology}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-astrology}
      PYTHON: /opt/venv/bin/python
      ASTRO_PA_ROOT: /app/backend/engine
      DATA_DIR: /app/backend/.local-data
      ASTRO_ALLOW_PAID: ${ASTRO_ALLOW_PAID:-0}
      ASTRO_PROGRESSIVE_READING: ${ASTRO_PROGRESSIVE_READING:-0}
      ASTRO_GUEST_ONBOARDING: ${ASTRO_GUEST_ONBOARDING:-0}
      ASTRO_ASK_ENABLED: ${ASTRO_ASK_ENABLED:-0}
      ASTRO_DEMO_AUTH: ${ASTRO_DEMO_AUTH:-0}
      ASTRO_LLM_MODEL: ${ASTRO_LLM_MODEL:-gemini-3.5-flash-lite}
      ASTRO_CHEAP_MODEL: ${ASTRO_CHEAP_MODEL:-gemini-3.5-flash-lite}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
      # Multi-user Supabase (omit AUTH_OWNER_EMAIL). For single-operator pin, set AUTH_OWNER_EMAIL.
      AUTH_ENABLED: ${AUTH_ENABLED:-1}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      AUTH_OWNER_EMAIL: ${AUTH_OWNER_EMAIL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - api-data:/app/backend/.local-data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  api-data:
