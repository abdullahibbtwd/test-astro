name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan full git history (all refs)
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --verbose
      - name: Planted fake secret must fail the scan
        run: |
          set -e
          mkdir -p /tmp/gitleaks-plant
          # Assemble at runtime so the full marker never appears in the repo
          # (matches [[rules]] ci-planted-secret — never a real secret).
          PREFIX='CI_PLANTED_PROBE_MARKER_'
          SUFFIX='ABCDEFGH12345678'
          printf 'token=%s%s\n' "$PREFIX" "$SUFFIX" > /tmp/gitleaks-plant/planted.env
          if gitleaks detect --source /tmp/gitleaks-plant --no-git --config .gitleaks.toml --redact --verbose; then
            echo "ERROR: gitleaks did not flag the planted secret" >&2
            exit 1
          fi
          echo "Planted secret correctly detected (scan failed as expected)"
