name: Frontend contract and shell
on:
  push:
    paths:
      - 'frontend/**'
      - 'docs/frontend/**'
      - 'Chart_wheel/**'
      - '.github/workflows/frontend-contract.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/frontend/**'
      - 'Chart_wheel/**'
      - '.github/workflows/frontend-contract.yml'
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Extracted fixtures are gitignored; the ZIP is tracked (see docs/handoff/SETUP.md).
      - name: Extract demo fixtures
        working-directory: .
        run: |
          unzip -q fixtures/frontend-demo-fixtures.zip -d .
          mkdir -p backend/mock
          rm -rf backend/mock/fixtures
          mv FE/mock-api/fixtures backend/mock/fixtures
          rm -rf FE
          test -f backend/mock/fixtures/manifest.json
      - run: npm run contract:build && npm run contract:types && npm run contract:zod
      - run: git diff --exit-code -- openapi.yaml contracts src/api/schema.d.ts src/api/zod
      - run: npm run typecheck && npm run lint
      - run: npx tsx --test tests/schema.test.ts tests/fonts.test.ts
      - run: npm run test:native
      - run: npm run bundle
        env:
          CI: '1'
# Live account databases are not uploaded to CI; the demo fixture ZIP is extracted above.
