  schemas:
    Lang:
      type: string
      enum:
        - tr
        - en
    ISODate:
      type: string
    LocalTime:
      type: string
    ISODateTime:
      type: string
    Body:
      type: string
      enum:
        - sun
        - moon
        - mercury
        - venus
        - mars
        - jupiter
        - saturn
        - uranus
        - neptune
        - pluto
        - north_node
        - south_node
    Angle:
      type: string
      enum:
        - ASC
        - DSC
        - MC
        - IC
    Sign:
      type: string
      enum:
        - aries
        - taurus
        - gemini
        - cancer
        - leo
        - virgo
        - libra
        - scorpio
        - sagittarius
        - capricorn
        - aquarius
        - pisces
    AspectType:
      type: string
      enum:
        - conjunction
        - sextile
        - square
        - trine
        - opposition
    Goal:
      type: string
      enum:
        - love
        - career
        - business
        - money
        - family
        - education
        - creativity
        - spirituality
        - rest
        - travel
        - relocation
    PlaceBand:
      type: string
      enum:
        - strongly_supportive
        - supportive
        - mixed
        - no_emphasis
        - challenging
    DayBand:
      type: string
      enum:
        - strongly_supportive
        - supportive
        - quiet
        - mixed
        - challenging
        - strongly_challenging
    DayTone:
      type: string
      enum:
        - favorable
        - mixed
        - quiet
        - challenging
    Activity:
      type: string
      enum:
        - love
        - meetings
        - business
        - contract
        - conversation
        - travel
        - shopping
        - project_start
        - interview
        - moving
    Grade:
      type: string
      enum:
        - excellent
        - good
        - neutral
        - avoid
    Importance:
      type: string
      enum:
        - major
        - moderate
        - minor
        - collective
    MoonPhase:
      type: string
      enum:
        - new
        - waxing_crescent
        - first_quarter
        - waxing_gibbous
        - full
        - waning_gibbous
        - last_quarter
        - waning_crescent
    Lens:
      type: string
      enum:
        - general
        - personal
        - professional
    CompatType:
      type: string
      enum:
        - love
        - family
        - work
    FamilyRelation:
      type: string
      enum:
        - parent_child
        - siblings
        - other
    Relation:
      type: string
      enum:
        - self
        - partner
        - child
        - parent
        - family
        - friend
        - colleague
        - business_partner
        - other
    Tier:
      type: string
      enum:
        - tight
        - strong
        - wide
    TransitPhase:
      type: string
      enum:
        - building
        - peak
        - easing
    Place:
      type: object
      properties:
        place_id:
          type: string
        name:
          type: string
        admin1:
          type:
            - string
            - "null"
        country_code:
          type: string
        country_name:
          type: string
        lat:
          type: number
        lon:
          type: number
        tz:
          type: string
      required:
        - place_id
        - name
        - admin1
        - country_code
        - country_name
        - lat
        - lon
        - tz
    Job:
      type: object
      properties:
        job_id:
          type: string
        kind:
          type: string
          enum:
            - natal_section
            - dossier
            - natal_reading
            - element_notes
            - day_reading
            - month_reading
            - year_reading
            - solar_return
