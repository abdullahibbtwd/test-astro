# Gitleaks config — report findings by rule/path/commit only; never print secret values in docs.
title = "astrology-app"

[extend]
useDefault = true

# CI planted-secret probe (workflow assembles marker under /tmp only;
# full match string must never appear contiguously in the repo).
[[rules]]
id = "ci-planted-secret"
description = "CI planted secret marker — must never appear in the repo"
regex = '''CI_PLANTED_PROBE_MARKER_[A-Z0-9]{16,}'''

[allowlist]
description = "Checked-in examples and public placeholders"
paths = [
  '''\.env\.example$''',
  '''\.env\..*\.example$''',
  '''\.env\.docker\.example$''',
  '''frontend/\.env\.example$''',
  '''docs/.*\.md$''',
]
regexes = [
  '''sb_publishable_\.\.\.''',
  '''YOUR_PROJECT_REF''',
  '''examplePublicKey''',
  '''fake-webhook-secret''',
  '''astrology:astrology@''',
]
